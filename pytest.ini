# Repo-root pytest config.
#
# ⛔ Run pytest FROM THE REPOSITORY ROOT, never from backend/. 49 test files do
# `from backend.x import y`, so a run started inside backend/ collapses with 50
# ModuleNotFoundError collection errors. This file living at the root is what makes
# `pytest` work with no arguments.
#
# asyncio_mode = auto is load-bearing: 21 test files use @pytest.mark.asyncio and
# conftest declares async fixtures with a plain @pytest.fixture. Under strict mode
# (the default from pytest-asyncio 0.21 onward) those fixtures are not handled and
# 13 tests error out with "no plugin handled it" — which reads like a broken test
# suite but is purely a mode mismatch.
[pytest]
# ⛔ pythonpath is load-bearing, and its absence fails ONLY under the bare `pytest`
# console script. `python -m pytest` injects the current directory into sys.path;
# the console script does not. So `python3 -m pytest` passed locally while the very
# same tree gave 49 × "ModuleNotFoundError: No module named 'backend'" in CI, which
# runs `pytest`. Verified both ways on this file: without this line, bare pytest
# collects 781 with 3 errors; with it, 803 clean.
pythonpath = .
testpaths = backend/tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    asyncio: async test executed by pytest-asyncio
