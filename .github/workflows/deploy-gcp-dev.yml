name: Deploy DEV to Cloud Run

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-gcp-dev.yml"

env:
  PROJECT_ID: YOUR_GCP_PROJECT_ID
  REGION: YOUR_REGION
  REPOSITORY: YOUR_ARTIFACT_REPO
  SERVICE: YOUR_SERVICE_NAME_DEV
  IMAGE: YOUR_REGION-docker.pkg.dev/YOUR_GCP_PROJECT_ID/YOUR_ARTIFACT_REPO/frontend-dev


jobs:
  # No test job here (Michal, 2026-10-10). The merge gate is the PR job `Frontend — panels and
  # share links` (tests.yml); the local push guard refuses `main` without it green on this SHA.
  # `npm run build` inside Cloud Build runs `tsc`, so a type error stops the deploy.
  deploy:
    name: Build & Deploy (dev)
    if: github.repository == 'ice13ball/something-rare'
    # ⛔ GitHub-hosted on purpose (not vars.CI_RUNNER): this job only uploads ./frontend and submits
    # frontend/cloudbuild.yaml with --async, ~1 billed minute (Michal 2026-10-10: <= 2 min per deploy).
    # The build, push, deploy and image prune run in Cloud Build. Watch them:
    #   gcloud builds list --project=something-rare --limit=3
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/YOUR_GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_POOL/providers/YOUR_PROVIDER
          service_account: YOUR_DEPLOYER_SA@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true   # the runner image ships gcloud; installing it cost ~26 s per run
      - name: Submit the Cloud Build (async)
        env:
          SHA: ${{ github.sha }}
        run: |
          gcloud builds submit frontend --project="$PROJECT_ID" --async \
            --config=frontend/cloudbuild.yaml \
            --gcs-source-staging-dir=gs://something-rare-cloudbuild-src/source \
            --substitutions="^~^_SERVICE=$SERVICE~_IMAGE=$IMAGE~_SHA=$SHA~_MAX=2~_SECRETS=ABYSSAL_API_KEY=ABYSSAL_API_KEY:latest,INDEXNOW_KEY=INDEXNOW_KEY:latest~_ENVVARS=VPS_API_URL=https://api.example.org"
