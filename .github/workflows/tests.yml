name: Tests

# Michal, 2026-10-10: GitHub Actions runs ONLY the frontend panel and share-link tests below
# (57 vitest files). Everything else — the backend pytest suite, the TypeScript check, the
# other vitest files, lint, the mirror classification gate — is NOT run here any more. Those run
# on the Mac, and only the tests of the layer whose code changed (pytest against the aqua test
# database through the 15434 tunnel; npx tsc / vitest in frontend/). The Cloud Build image build
# still runs `tsc` as part of `npm run build`, so a type error stops the deploy, not the merge.
#
# The job always starts and always ends `success` when the frontend did not change (the
# `changes` step), because the local push guard AI-Wall/narzedzia/hooks/main-1-1-z-dev.sh needs
# >= 1 `success` of this exact job name on the SHA reaching `main`. Keep the name byte-identical.

on:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — panels and share links
    permissions:
      contents: read
      checks: read     # area detection reads the base commit's check runs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Did this area change?
        id: changes
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_NAME: Frontend — panels and share links
          KEEP_RE: '^(frontend|admin-panel)/|^backend/(startup_seeds|profiles)\.py$|^\.github/workflows/tests\.yml$'
          SKIP_RE: '.'
        run: |
          set -u
          emit() { echo "run=$1" >> "${GITHUB_OUTPUT:-/dev/stdout}"; echo "area decision: run=$1 ($2)"; }
          case "$EVENT_NAME" in
            push) BASE="$EVENT_BEFORE" ;;
            pull_request) BASE="$PR_BASE" ;;
            *) emit true "event $EVENT_NAME: no base, run everything"; exit 0 ;;
          esac
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) emit true "no usable base commit"; exit 0 ;;
          esac
          # Trust the base only if this very job was green there (see top of file).
          ROWS=$(gh api --paginate "repos/$REPO/commits/$BASE/check-runs?per_page=100" \
                   --jq '.check_runs[] | [.name, .conclusion] | @tsv' 2>/dev/null) \
            || { emit true "cannot read check runs of base ${BASE:0:7}"; exit 0; }
          OKS=$(printf '%s\n' "$ROWS" | awk -F'\t' -v j="$JOB_NAME" \
                  '$1==j || $1=="test / " j {if ($2=="success") ok++}
                   END {print ok+0}')
          BAD=$(printf '%s\n' "$ROWS" | awk -F'\t' -v j="$JOB_NAME" \
                  '($1==j || $1=="test / " j) && $2 ~ /^(failure|timed_out|action_required|startup_failure)$/ {bad++}
                   END {print bad+0}')
          if [ "$OKS" -lt 1 ] || [ "$BAD" -gt 0 ]; then
            emit true "base ${BASE:0:7} not green for this job (success=$OKS red=$BAD)"; exit 0
          fi
          git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null \
            || { emit true "base ${BASE:0:7} not fetchable"; exit 0; }
          FILES=$(git diff --name-only "$BASE" "$HEAD_SHA") \
            || { emit true "diff failed"; exit 0; }
          [ -n "$FILES" ] || { emit true "empty diff, run to be safe"; exit 0; }
          HIT=$(printf '%s\n' "$FILES" | awk '$0 ~ ENVIRON["KEEP_RE"] || $0 !~ ENVIRON["SKIP_RE"] {print; n++; if (n==3) exit}')
          if [ -n "$HIT" ]; then
            emit true "changed since ${BASE:0:7}: $(echo "$HIT" | tr '\n' ' ')"
          else
            emit false "nothing in this area changed since green ${BASE:0:7}"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22          # matches frontend/Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci
      - name: Panel and share-link tests
        if: steps.changes.outputs.run == 'true'
        run: |
          npx vitest run \
            src/__tests__/air-quality-units.test.tsx \
            src/__tests__/aoc-poc-panel.test.tsx \
            src/__tests__/argo-oxygen-docs.test.tsx \
            src/__tests__/argo-oxygen-panel.test.tsx \
            src/__tests__/argo-oxygen-profile-panel.test.tsx \
            src/__tests__/coastdom-row-reset-label.test.tsx \
            src/__tests__/coastdom-year-filter.test.tsx \
            src/__tests__/coral-exposure-panel-fields.test.tsx \
            src/__tests__/dam-panel-gdw-fields.test.tsx \
            src/__tests__/fire-panel-extended-fields.test.tsx \
            src/__tests__/glodap-cast-panel.test.tsx \
            src/__tests__/glodap-points-panel.test.tsx \
            src/__tests__/hex-sample-summary.test.tsx \
            src/__tests__/memento-month-precision.test.tsx \
            src/__tests__/mosaic-panel-fields.test.tsx \
            src/__tests__/oceansites-history-section.test.tsx \
            src/__tests__/oceansites-history-sources.test.tsx \
            src/__tests__/oceansites-station-fields.test.tsx \
            src/__tests__/onc-ctd-window.test.tsx \
            src/__tests__/onc-description.test.tsx \
            src/__tests__/onc-earthquakes-states.test.tsx \
            src/__tests__/onc-no-scalar-reason.test.tsx \
            src/__tests__/onc-quality-flags.test.tsx \
